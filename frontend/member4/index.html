<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Dine - Billing & Payment</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Smart Dine</h1>
    <p>Billing & Payment Management</p>
</header>

<nav>
    <button onclick="showSection('billing')">Billing</button>
    <button onclick="showSection('payment')">Payment</button>
    <button onclick="showSection('viewBills')">View Bills</button>
    <button onclick="showSection('viewPayments')">View Payments</button>
</nav>

<main>

    <!-- BILLING SECTION -->
    <section id="billing" class="section">

        <h2>Create Bill</h2>

        <form id="billForm">

            <label>Order ID</label>
            <input type="number" id="orderID" required>

            <label>Bill Date</label>
            <input type="datetime-local" id="billDate" required>

            <label>Subtotal</label>
            <input type="number" id="subtotal" step="0.01" required>

            <label>Tax</label>
            <input type="number" id="tax" step="0.01" value="0">

            <label>Discount</label>
            <input type="number" id="discount" step="0.01" value="0">

            <label>Total Amount</label>
            <input type="number" id="totalAmount" step="0.01" required>

            <label>Bill Status</label>
            <select id="billStatus" required>
                <option value="PENDING">PENDING</option>
                <option value="PAID">PAID</option>
                <option value="CANCELLED">CANCELLED</option>
            </select>

            <button type="submit">Create Bill</button>

        </form>

        <p id="billMessage"></p>

    </section>


    <!-- PAYMENT SECTION -->
    <section id="payment" class="section">

        <h2>Create Payment</h2>

        <form id="paymentForm">

            <label>Bill ID</label>
            <input type="number" id="paymentBillID" required>

            <label>Payment Date</label>
            <input type="datetime-local" id="paymentDate" required>

            <label>Amount</label>
            <input type="number" id="paymentAmount" step="0.01" required>

            <label>Payment Method</label>
            <select id="paymentMethod" required>
                <option value="CASH">CASH</option>
                <option value="CARD">CARD</option>
                <option value="ONLINE">ONLINE</option>
            </select>

            <label>Payment Status</label>
            <select id="paymentStatus" required>
                <option value="SUCCESS">SUCCESS</option>
                <option value="PENDING">PENDING</option>
                <option value="FAILED">FAILED</option>
            </select>

            <label>Transaction Reference</label>
            <input type="text" id="transactionRef">

            <button type="submit">Create Payment</button>

        </form>

        <p id="paymentMessage"></p>

    </section>


    <!-- VIEW BILLS -->
    <section id="viewBills" class="section">

        <h2>All Bills</h2>

        <button onclick="loadBills()">Load Bills</button>

        <div id="billList"></div>

    </section>


    <!-- VIEW PAYMENTS -->
    <section id="viewPayments" class="section">

        <h2>All Payments</h2>

        <button onclick="loadPayments()">Load Payments</button>

        <div id="paymentList"></div>

    </section>

</main>

<script src="app.js"></script>

</body>
</html>
